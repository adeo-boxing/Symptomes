<!DOCTYPE html>
<html lang="fr" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Suivi des Symptômes</title>
    
    <!-- PWA Meta tags -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0d9488">
    <link rel="apple-touch-icon" href="icon-196.png">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        teal: { 500: '#14b8a6', 600: '#0d9488' }
                    }
                }
            }
        }
    </script>
    <style>
        details > summary { list-style: none; }
        details > summary::-webkit-details-marker { display: none; }

        @keyframes pulse-record {
            0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); }
            70% { box-shadow: 0 0 0 10px rgba(239, 68, 68, 0); }
            100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
        }
        .recording {
            animation: pulse-record 1.5s infinite;
            background-color: #ef4444 !important;
            color: white !important;
            border-color: #ef4444 !important;
        }
        #toast-container {
            position: fixed; bottom: 20px; right: 20px; z-index: 50;
            display: flex; flex-direction: column; gap: 10px;
        }
        .toast {
            min-width: 250px; padding: 12px 20px; border-radius: 8px;
            color: white; font-weight: 500;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            transform: translateX(120%);
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .toast.show { transform: translateX(0); }
        .toast.success { background-color: #0d9488; }
        .toast.error { background-color: #ef4444; }
        .toast.info { background-color: #3b82f6; }
    </style>
</head>
<body class="bg-gray-50 dark:bg-gray-900 text-gray-800 dark:text-gray-200 min-h-screen transition-colors duration-200 font-sans">

    <!-- En-tête -->
    <header class="bg-teal-600 dark:bg-teal-800 text-white shadow-md">
        <div class="max-w-5xl mx-auto px-4 py-4 flex justify-between items-center">
            <h1 class="text-xl md:text-2xl font-bold flex items-center gap-2">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-7 w-7" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
                </svg>
                Suivi des Symptômes
            </h1>
            <button id="themeToggle" class="p-2 rounded-full hover:bg-teal-700 dark:hover:bg-teal-700 transition" title="Basculer le mode sombre">
                <svg id="icon-sun" class="w-6 h-6 hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"></path>
                </svg>
                <svg id="icon-moon" class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"></path>
                </svg>
            </button>
        </div>
    </header>

    <!-- Contenu principal -->
    <main class="max-w-5xl mx-auto px-4 py-8 grid grid-cols-1 lg:grid-cols-2 gap-8">
        
        <!-- Colonne Gauche -->
        <section class="bg-white dark:bg-gray-800 p-6 rounded-xl shadow-sm border border-gray-200 dark:border-gray-700 h-fit">
            <h2 class="text-lg font-semibold mb-6 pb-2 border-b border-gray-200 dark:border-gray-700">Nouvelle Entrée</h2>
            
            <form id="entryForm" class="space-y-6">
                <div>
                    <label class="block text-sm font-medium mb-2">Date</label>
                    <input type="date" id="entryDate" required
                        class="w-full p-3 border border-gray-300 dark:border-gray-600 rounded-lg bg-gray-50 dark:bg-gray-700 text-gray-900 dark:text-white focus:ring-2 focus:ring-teal-500 focus:outline-none">
                </div>

                <div>
                    <label class="block text-sm font-medium mb-3">Symptômes ressentis</label>
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-3" id="symptomsContainer">
                        <!-- Généré en JS -->
                    </div>
                </div>

                <div>
                    <div class="flex justify-between items-end mb-2">
                        <label class="block text-sm font-medium">Notes & Ressenti</label>
                        <button type="button" id="micBtn" class="flex items-center gap-1 text-sm bg-gray-200 dark:bg-gray-700 px-3 py-1.5 rounded-full hover:bg-gray-300 dark:hover:bg-gray-600 transition">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4m0 0H8m4 0h4m-4-8a3 3 0 01-3-3V5a3 3 0 116 0v6a3 3 0 01-3 3z"></path></svg>
                            <span>Dicter</span>
                        </button>
                    </div>
                    <textarea id="entryNotes" rows="4" placeholder="Décrivez comment vous vous sentez..."
                        class="w-full p-3 border border-gray-300 dark:border-gray-600 rounded-lg bg-gray-50 dark:bg-gray-700 text-gray-900 dark:text-white focus:ring-2 focus:ring-teal-500 focus:outline-none"></textarea>
                </div>

                <button type="submit" class="w-full bg-teal-600 hover:bg-teal-700 text-white font-semibold py-3 px-4 rounded-lg transition-colors">
                    Enregistrer l'entrée
                </button>
            </form>
        </section>

        <!-- Colonne Droite : Sections Accordéons -->
        <section class="flex flex-col gap-6">
            
            <!-- Actions de données (Fermé par défaut) -->
            <details class="bg-white dark:bg-gray-800 rounded-xl shadow-sm border border-gray-200 dark:border-gray-700 group">
                <summary class="flex justify-between items-center p-6 text-lg font-semibold cursor-pointer select-none">
                    Gérer les données
                    <svg class="w-5 h-5 transition-transform duration-300 group-open:rotate-180" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
                </summary>
                <div class="px-6 pb-6 border-t border-gray-100 dark:border-gray-700 pt-4">
                    <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
                        <button id="exportJsonBtn" class="flex justify-center items-center gap-2 bg-gray-100 dark:bg-gray-700 hover:bg-gray-200 dark:hover:bg-gray-600 py-2 px-3 rounded-lg text-sm font-medium transition">
                            Exporter JSON
                        </button>
                        <button id="exportTxtBtn" class="flex justify-center items-center gap-2 bg-gray-100 dark:bg-gray-700 hover:bg-gray-200 dark:hover:bg-gray-600 py-2 px-3 rounded-lg text-sm font-medium transition">
                            Exporter TXT
                        </button>
                        <label class="flex justify-center items-center gap-2 bg-gray-100 dark:bg-gray-700 hover:bg-gray-200 dark:hover:bg-gray-600 py-2 px-3 rounded-lg text-sm font-medium transition cursor-pointer">
                            Importer JSON
                            <input type="file" id="importJsonFile" accept=".json" class="hidden">
                        </label>
                    </div>
                </div>
            </details>

            <!-- Historique (Ouvert par défaut) -->
            <details open class="bg-white dark:bg-gray-800 rounded-xl shadow-sm border border-gray-200 dark:border-gray-700 flex-1 group">
                <summary class="flex justify-between items-center p-6 cursor-pointer select-none">
                    <h2 class="text-lg font-semibold">Historique</h2>
                    <div class="flex items-center gap-4">
                        <span id="entryCount" class="text-sm text-gray-500 dark:text-gray-400">0 entrée(s)</span>
                        <svg class="w-5 h-5 transition-transform duration-300 group-open:rotate-180" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
                    </div>
                </summary>
                <div class="px-6 pb-6 border-t border-gray-100 dark:border-gray-700 pt-4">
                    <div id="historyContainer" class="space-y-4 overflow-y-auto max-h-[500px] pr-2">
                        <p class="text-gray-500 italic text-center py-4">Aucune donnée enregistrée.</p>
                    </div>
                </div>
            </details>

        </section>
    </main>

    <div id="toast-container"></div>

    <script>
        /* --- DONNÉES ET CONFIGURATION SÉCURISÉES --- */
        const STORAGE_KEY = 'symptomTrackerData';
        const symptomsList = [
            "Maux de tête", 
            "Mal aux yeux", 
            "Mal aux oreilles",
            "Jambe qui tremble", 
            "Bras qui tremble", 
            "Perte de force dans la jambe", 
            "Mal aux cervicales", 
            "Mal aux trapèzes"
        ];
        
        let entries = [];
        try {
            const saved = localStorage.getItem(STORAGE_KEY);
            if (saved) {
                const parsed = JSON.parse(saved);
                if (Array.isArray(parsed)) entries = parsed;
            }
        } catch (e) {
            console.error("Erreur de lecture des données locales, remise à zéro.", e);
            entries = [];
        }

        /* --- FONCTIONS D'INITIALISATION --- */
        function initApp() {
            initDarkMode();
            renderSymptomsCheckboxes();
            
            const dateInput = document.getElementById('entryDate');
            if (dateInput) dateInput.valueAsDate = new Date();
            
            renderHistory();
            initSpeechRecognition();
        }

        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', initApp);
        } else {
            initApp();
        }

        /* --- MODE SOMBRE --- */
        function initDarkMode() {
            const themeToggleBtn = document.getElementById('themeToggle');
            const iconSun = document.getElementById('icon-sun');
            const iconMoon = document.getElementById('icon-moon');

            if (localStorage.getItem('theme') === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
                document.documentElement.classList.add('dark');
                if(iconMoon) iconMoon.classList.add('hidden');
                if(iconSun) iconSun.classList.remove('hidden');
            }

            if (themeToggleBtn) {
                themeToggleBtn.addEventListener('click', () => {
                    document.documentElement.classList.toggle('dark');
                    if (document.documentElement.classList.contains('dark')) {
                        localStorage.setItem('theme', 'dark');
                        iconMoon.classList.add('hidden');
                        iconSun.classList.remove('hidden');
                    } else {
                        localStorage.setItem('theme', 'light');
                        iconSun.classList.add('hidden');
                        iconMoon.classList.remove('hidden');
                    }
                });
            }
        }

        /* --- INTERFACE DU FORMULAIRE --- */
        function renderSymptomsCheckboxes() {
            const container = document.getElementById('symptomsContainer');
            if (!container) return;

            let html = "";
            symptomsList.forEach((symptom, index) => {
                const id = `symp_${index}`;
                html += `
                    <label for="${id}" class="flex items-center space-x-3 p-3 border border-gray-200 dark:border-gray-700 rounded-lg cursor-pointer hover:bg-teal-50 dark:hover:bg-teal-900/20 transition group">
                        <input type="checkbox" id="${id}" value="${symptom}" class="symptom-checkbox w-5 h-5 text-teal-600 rounded border-gray-300 dark:border-gray-600 focus:ring-teal-500 dark:bg-gray-700">
                        <span class="text-sm font-medium select-none group-hover:text-teal-700 dark:group-hover:text-teal-400">${symptom}</span>
                    </label>
                `;
            });
            container.innerHTML = html;
        }

        /* --- GESTION DES ENTRÉES --- */
        const entryForm = document.getElementById('entryForm');
        if (entryForm) {
            entryForm.addEventListener('submit', (e) => {
                e.preventDefault();
                
                const date = document.getElementById('entryDate').value;
                const notes = document.getElementById('entryNotes').value.trim();
                const checkedSymptoms = Array.from(document.querySelectorAll('.symptom-checkbox:checked')).map(cb => cb.value);
                
                if (checkedSymptoms.length === 0 && notes === "") {
                    showToast("Veuillez sélectionner un symptôme ou écrire une note.", "error");
                    return;
                }

                const newEntry = {
                    id: Date.now().toString(),
                    date: date,
                    symptoms: checkedSymptoms,
                    notes: notes,
                    timestamp: new Date().getTime()
                };

                entries.push(newEntry);
                saveData();
                
                document.querySelectorAll('.symptom-checkbox').forEach(cb => cb.checked = false);
                document.getElementById('entryNotes').value = "";
                
                renderHistory();
                showToast("Entrée enregistrée avec succès !", "success");
            });
        }

        function deleteEntry(id) {
            entries = entries.filter(e => e.id !== id);
            saveData();
            renderHistory();
            showToast("Entrée supprimée.", "info");
        }

        window.deleteEntry = deleteEntry; 

        function saveData() {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(entries));
        }

        function renderHistory() {
            const container = document.getElementById('historyContainer');
            const countSpan = document.getElementById('entryCount');
            if (!container || !countSpan) return;

            countSpan.textContent = `${entries.length} entrée(s)`;
            
            if (entries.length === 0) {
                container.innerHTML = '<p class="text-gray-500 italic text-center py-4">Aucune donnée enregistrée.</p>';
                return;
            }

            const sortedEntries = [...entries].sort((a, b) => new Date(b.date) - new Date(a.date) || b.timestamp - a.timestamp);
            
            container.innerHTML = sortedEntries.map(entry => {
                const symptomsHtml = entry.symptoms.length > 0 
                    ? `<div class="flex flex-wrap gap-1.5 mt-2">
                        ${entry.symptoms.map(s => `<span class="bg-teal-100 dark:bg-teal-900/50 text-teal-800 dark:text-teal-300 text-xs px-2 py-1 rounded-md border border-teal-200 dark:border-teal-800">${s}</span>`).join('')}
                       </div>`
                    : '';
                
                const notesHtml = entry.notes 
                    ? `<p class="text-sm mt-3 text-gray-700 dark:text-gray-300 bg-gray-50 dark:bg-gray-900/50 p-3 rounded border border-gray-100 dark:border-gray-700">${entry.notes}</p>` 
                    : '';

                const dateObj = new Date(entry.date);
                const formattedDate = dateObj.toLocaleDateString('fr-FR', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });

                return `
                    <div class="border border-gray-200 dark:border-gray-700 rounded-lg p-4 relative group/item">
                        <div class="flex justify-between items-start">
                            <span class="font-semibold text-teal-600 dark:text-teal-400 capitalize">${formattedDate}</span>
                            <button onclick="window.deleteEntry('${entry.id}')" class="text-gray-400 hover:text-red-500 transition opacity-0 group-hover/item:opacity-100" title="Supprimer">
                                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
                            </button>
                        </div>
                        ${symptomsHtml}
                        ${notesHtml}
                    </div>
                `;
            }).join('');
        }

        /* --- IMPORTS / EXPORTS --- */
        document.getElementById('exportJsonBtn')?.addEventListener('click', () => {
            if (entries.length === 0) return showToast("Aucune donnée à exporter.", "error");
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(entries, null, 2));
            triggerDownload(dataStr, `symptomes_export_${new Date().toISOString().split('T')[0]}.json`);
            showToast("Export JSON réussi.", "success");
        });

        document.getElementById('exportTxtBtn')?.addEventListener('click', () => {
            if (entries.length === 0) return showToast("Aucune donnée à exporter.", "error");
            let txtContent = "SUIVI DES SYMPTÔMES - EXPORT\n";
            txtContent += `Généré le : ${new Date().toLocaleDateString('fr-FR')} à ${new Date().toLocaleTimeString('fr-FR')}\n`;
            txtContent += "========================================\n\n";
            const sortedEntries = [...entries].sort((a, b) => new Date(b.date) - new Date(a.date));
            
            sortedEntries.forEach(entry => {
                txtContent += `Date : ${entry.date}\n`;
                if(entry.symptoms.length > 0) txtContent += `Symptômes : ${entry.symptoms.join(', ')}\n`;
                if(entry.notes) txtContent += `Notes : ${entry.notes}\n`;
                txtContent += "----------------------------------------\n";
            });

            const dataStr = "data:text/plain;charset=utf-8," + encodeURIComponent(txtContent);
            triggerDownload(dataStr, `symptomes_rapport_${new Date().toISOString().split('T')[0]}.txt`);
            showToast("Rapport texte généré.", "success");
        });

        document.getElementById('importJsonFile')?.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = (event) => {
                try {
                    const importedData = JSON.parse(event.target.result);
                    if (Array.isArray(importedData)) {
                        entries = importedData;
                        saveData();
                        renderHistory();
                        showToast("Données importées avec succès !", "success");
                    } else {
                        throw new Error("Format invalide");
                    }
                } catch (err) {
                    showToast("Erreur lors de l'import : fichier JSON invalide.", "error");
                }
                e.target.value = ""; 
            };
            reader.readAsText(file);
        });

        function triggerDownload(data, filename) {
            const downloadAnchorNode = document.createElement('a');
            downloadAnchorNode.setAttribute("href", data);
            downloadAnchorNode.setAttribute("download", filename);
            document.body.appendChild(downloadAnchorNode);
            downloadAnchorNode.click();
            downloadAnchorNode.remove();
        }

        /* --- DICTÉE VOCALE --- */
        let recognition;
        let isRecording = false;
        
        function initSpeechRecognition() {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            const micBtn = document.getElementById('micBtn');
            const notesField = document.getElementById('entryNotes');

            if (!SpeechRecognition || !micBtn) {
                if(micBtn) micBtn.style.display = 'none';
                return;
            }

            recognition = new SpeechRecognition();
            recognition.lang = 'fr-FR';
            recognition.continuous = false;
            recognition.interimResults = false;

            recognition.onstart = () => {
                isRecording = true;
                micBtn.classList.add('recording');
                micBtn.querySelector('span').innerText = "Écoute...";
            };

            recognition.onresult = (event) => {
                const transcript = event.results[0][0].transcript;
                const currentText = notesField.value;
                notesField.value = currentText ? `${currentText} ${transcript}` : transcript;
            };

            recognition.onerror = (event) => {
                showToast("Erreur de dictée : " + event.error, "error");
                stopRecording(micBtn);
            };

            recognition.onend = () => stopRecording(micBtn);

            micBtn.addEventListener('click', () => {
                if (isRecording) recognition.stop();
                else recognition.start();
            });
        }

        function stopRecording(btn) {
            isRecording = false;
            btn.classList.remove('recording');
            btn.querySelector('span').innerText = "Dicter";
        }

        /* --- SYSTÈME DE NOTIFICATIONS --- */
        function showToast(message, type = "info") {
            const container = document.getElementById('toast-container');
            if (!container) return;
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            toast.innerText = message;
            
            container.appendChild(toast);
            requestAnimationFrame(() => toast.classList.add('show'));
            
            setTimeout(() => {
                toast.classList.remove('show');
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        /* --- ENREGISTREMENT DU SERVICE WORKER (PWA) --- */
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                    .catch((error) => console.log('Échec ServiceWorker:', error));
            });
        }
    </script>
</body>
</html>
